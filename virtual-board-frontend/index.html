<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="auth-view" class="auth-shell">
      <div class="auth-card">
        <h1>Virtual Board</h1>
        <p class="muted">Sign in to open your shared board.</p>

        <form id="login-form">
          <label>
            Username
            <input id="username" name="username" autocomplete="username" required minlength="3">
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
          </label>
          <button type="submit">Log in</button>
        </form>

        <button id="register-button" class="secondary" type="button">Create account</button>
        <p id="auth-message" class="message" aria-live="polite"></p>
      </div>
    </section>

    <section id="app-view" class="hidden">
      <header class="topbar">
        <div>
          <h1>Virtual Board</h1>
          <span id="user-label" class="muted"></span>
        </div>
        <div class="topbar-actions">
          <select id="board-select" aria-label="Choose board"></select>
          <button id="add-note-button" type="button">+ Note</button>
          <button id="logout-button" class="secondary" type="button">Log out</button>
        </div>
      </header>

      <div id="status-bar" class="status-bar">Ready</div>
      <div id="board" class="board" aria-label="Virtual whiteboard"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
